<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Runalis enemy art review</title><style>
body{margin:0;background:#171b18;color:#e5dcc7;font:15px system-ui}header{padding:16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}label{display:flex;gap:6px;align-items:center}select,button{background:#292f2b;color:#e5dcc7;padding:7px;border:1px solid #5a6253}canvas{width:100%;image-rendering:pixelated;display:block}p{padding:0 16px;color:#b4b8aa}</style></head><body><header><strong>Enemy art review</strong>
<label>Pose <select id="pose"><option>idle</option><option>walk</option><option>run</option><option>attack</option><option>hurt</option><option>block</option><option>death</option></select></label>
<label>Facing <select id="facing"><option value="1">East</option><option value="-1">West</option><option value="down">South</option><option value="up">North</option></select></label>
<label>Lighting <select id="lighting"><option>day</option><option>night</option><option>dungeon</option></select></label>
<label>Distance <select id="distance"><option value="1">Normal</option><option value="0.7">Distant</option><option value="1.5">Close</option></select></label>
<label>Variant <select id="variant"><option value="0">1</option><option value="1">2</option><option value="2">3</option></select></label><label>Boss phase <select id="phase"><option>1</option><option>2</option><option>3</option></select></label><label><input id="labels" type="checkbox" checked> Names</label></header>
<canvas id="review" width="1440" height="1260"></canvas><p>Uses the game’s enemy renderer and equipment layers. Collision and combat values are unchanged. Human reference appears first. Wolf and demon companions appear at the end.</p><script type="module" src="/src/enemyVisualLab.js"></script></body></html>
