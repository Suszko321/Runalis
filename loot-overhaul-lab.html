<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Runalis loot and gear review</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="visual-polish.css"><link rel="stylesheet" href="lexicon.css"><style>
body{margin:0;background:#171b18;color:#e5dcc7;font:15px system-ui;overflow:auto}header{padding:16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}label{display:flex;gap:6px;align-items:center}select,button{background:#292f2b;color:#e5dcc7;padding:7px;border:1px solid #5a6253}canvas#review{width:100%;image-rendering:pixelated;display:block}#inventory{position:relative;display:block;width:100%;max-width:1440px;margin:auto}#messages{padding:12px 20px;min-height:46px;color:#d9bf84}.lab-note{padding:0 20px;color:#b4b8aa}h2{padding:0 20px}</style></head><body>
<header><strong>Loot &amp; gear review</strong><label>Loadout <select id="set"></select></label><label>Starting tier <select id="tier"><option>1</option><option>5</option><option>10</option><option>20</option></select></label><label>Pose <select id="pose"><option>walk</option><option>idle</option></select></label><button id="reset">Reset review</button></header>
<p class="lab-note">A separate review character with supplied materials. Changes here do not affect your saved game. Inspect equipment below; visit Mara’s forge in Orrakai for upgrades in the game.</p>
<canvas id="review" width="1440" height="900"></canvas><div id="messages" role="status"></div><div id="inventory"></div><script type="module" src="src/lootOverhaulLab.js"></script></body></html>
