<text x="55" y="62" text-anchor="start">Orrakai</text><circle cx="18" cy="35" r="6" fill="#efcd79"/></g><g font-family="Georgia,serif" fill="#ece0bf"><text x="80" y="915" font-size="48">Runalis · Continental master plan</text><text x="80" y="967" font-size="28">Echoryn → Black Pine Pass or Blackfen → Aureate → the southern highway → Zarynth Trade Ward</text><text x="80" y="1014" font-size="27">The Severed Causeway and Ascension Wastes are an optional northern branch. Acts follow story progress.</text><text x="80" y="1062" font-size="27">Detailed current regions and inhabited road sites sit within a wider geographic plan; the greater capital remains future content.</text></g></svg>