<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Runalis · Creator Review</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="visual-polish.css"><body><script type="module">
import {openCharacterCreator} from './src/characterCreator.js';
import {createPlayer} from './src/player.js';
const player=createPlayer('Appearance review');
const game={player,logLines:[],log(){},save(){}};
openCharacterCreator(game);
// This review surface deliberately stops before applying a character to a game.
document.addEventListener('click',event=>{
  if(event.target.closest('[data-creator-start]')){event.preventDefault();event.stopImmediatePropagation();}
},true);
</script></body></html>
