<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <title>Runalis · Continental field review</title>
 <style>
  :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#171e1a;color:#e5d9b8;font:14px system-ui,sans-serif}header{padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid #5c6049}h1{font:22px Georgia;margin:0 10px 0 0}select,button{font:inherit;padding:8px 12px;color:#f0e4c8;background:#29352b;border:1px solid #797153;border-radius:3px}button:hover{background:#3b4736}label{display:flex;align-items:center;gap:6px}.field{max-width:1120px;margin:auto}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;outline:none}#status{min-height:44px;padding:11px 18px;background:#1f2a22;font-variant-numeric:tabular-nums;line-height:1.5}#description{padding:10px 18px;color:#c4c9b0;line-height:1.5;border-top:1px solid #414c3d;margin:0}footer{padding:11px 18px;color:#9eab9c;font-size:12px;line-height:1.5}.error{color:#ffb1a0} @media(max-width:700px){header{gap:8px}h1{width:100%}select{max-width:100%}}
 </style>
</head>
<body>
 <header><h1>Continental field review</h1><label>Place <select id="scene" aria-label="Review location"></select></label><label>Route <select id="route" aria-label="Review walking route"></select></label><button id="walk">Walk route</button><button id="night">Day / night</button><button id="geometry">Collision overlay</button></header>
 <main class="field"><canvas id="field" width="1120" height="700" tabindex="0" aria-label="Runalis continental preview"></canvas><div id="status" role="status">Loading the continent…</div><p id="description"></p><footer>Developer review · Normal gameplay renderer and collision · WASD or arrows to walk · Shift to survey quickly · Escape to stop the guided walk · This page never writes a profile save.</footer></main>
 <script type="module" src="./src/continentLab.js"></script>
</body>
</html>
